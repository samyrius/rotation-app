name: Android APK build

# APK builds must be started manually by the user.
# Do not build on push or pull requests.
on:
  push:
    branches: ["resimanage-2-apk-candidate"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run regression tests
        env:
          ROTATION_SECRET: ci-test-secret
        run: pytest -q

  build-debug-apk:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
      - name: Download Gradle
        run: |
          curl --fail --location --silent --show-error https://services.gradle.org/distributions/gradle-8.13-bin.zip --output /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
      - name: Build debug APK
        working-directory: android
        run: /tmp/gradle-8.13/bin/gradle --no-daemon --stacktrace assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rotation-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
